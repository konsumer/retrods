name: release

on:
  push:
    tags: ['v*']
  release:
    types: [created]

permissions:
  contents: write

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/fetch-cores.sh
      - run: ./scripts/build-apps.sh
      - run: ./scripts/gen-settings.py

      # The apps plus the launcher associations, which have to ship together:
      # an app without its association cannot be launched.
      - name: package
        run: |
          mkdir -p dist
          cp apps/*.nds dist/
          cp docs/settings-example.json dist/settings.json
          cp README.md dist/
          ( cd dist && sha256sum * > SHA256SUMS )
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
